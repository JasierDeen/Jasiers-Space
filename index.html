<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jasier's Space</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Space">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
:root{--bg:#0f1115;--panel:#181b22;--text:#e8eaf0;--muted:#8b91a0;--line:#262a34;--q1:#ef5350;--q2:#4f8cff;--q3:#f5a524;--q4:#8b91a0}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f4f5f8;--panel:#fff;--text:#14161c;--muted:#6b7180;--line:#e2e4ea}}
:root[data-theme=light]{--bg:#f4f5f8;--panel:#fff;--text:#14161c;--muted:#6b7180;--line:#e2e4ea}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overscroll-behavior:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,input{font:inherit}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px;gap:8px}
header h1{font-size:20px;margin:0;font-weight:700}
header small{color:var(--muted);display:block;font-size:12px;font-weight:400}
.hb{display:flex;gap:6px}
.icon-btn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;min-width:42px;height:42px;padding:0 10px}
.icon-btn.on{border-color:var(--q2);color:var(--q2)}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.sbar{padding:0 12px 8px}
.sbar input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
.banner{margin:0 12px 8px;padding:9px 12px;border-radius:10px;background:rgba(79,140,255,.15);color:var(--text);font-size:13px;display:flex;align-items:center;gap:8px}
.banner span{flex:1}.banner button{background:var(--q2);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:13px}
.banner .x{background:none;color:var(--muted);padding:6px}
.chips{display:flex;gap:4px;padding:2px 10px 8px;overflow-x:auto;flex:none}
.fchip{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:6px 9px;font-size:13px}
.fchip.on{background:var(--q2);border-color:var(--q2);color:#fff}
#grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;padding:4px 10px 10px}
#grid.focus{grid-template-columns:1fr;grid-template-rows:1fr}
#grid.focus .quad:not(.focused){display:none}
#grid.today{display:block;overflow-y:auto;padding:4px 10px 90px}
.quad{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:14px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.quad.over{outline:2px dashed var(--c);outline-offset:-3px}
[data-q="1"]{--c:var(--q1)}[data-q="2"]{--c:var(--q2)}[data-q="3"]{--c:var(--q3)}[data-q="4"]{--c:var(--q4)}
.qh{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 6px;cursor:pointer;gap:6px}
.qh b{font-size:14px;color:var(--c)}
.qh span{font-size:11px;color:var(--muted);display:block}
.count{background:var(--c);color:#fff;border-radius:999px;font-size:11px;min-width:20px;text-align:center;padding:1px 6px;flex:none}
.list{flex:1;overflow-y:auto;padding:0 6px 6px;-webkit-overflow-scrolling:touch}
.task{display:flex;gap:8px;align-items:flex-start;padding:7px 4px;border-bottom:1px solid var(--line);font-size:14px}
.task:last-child{border-bottom:0}
.chk{flex:none;position:relative;width:24px;height:24px;border-radius:50%;border:2px solid var(--c,var(--q2));background:none;margin-top:0;padding:0;color:#fff;font-size:14px;line-height:1}
.chk::after{content:"";position:absolute;inset:-9px}
.done .chk{background:var(--c,var(--q2))}
.done .t{text-decoration:line-through;color:var(--muted)}
.t{flex:1;min-width:0;word-break:break-word;padding:1px 0}
.note{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.mv{flex:none;background:none;border:0;color:var(--muted);font-size:18px;padding:0 4px}
.pill{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;margin:3px 4px 0 0;background:var(--line);color:var(--muted)}
.pill.late{background:rgba(239,83,80,.18);color:var(--q1)}.pill.soon{background:rgba(245,165,36,.18);color:var(--q3)}
.pill.need{background:rgba(239,83,80,.18);color:var(--q1)}.pill.want{background:rgba(79,140,255,.18);color:var(--q2)}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:16px 6px}
.addq{border:0;background:none;color:var(--c);font-size:13px;padding:10px;border-top:1px solid var(--line);width:100%}
.dsum{display:flex;justify-content:space-between;align-items:center;padding:0 4px 6px;color:var(--muted);font-size:13px}
.dhead{font-size:12px;color:var(--muted);margin:8px 4px 6px;text-transform:uppercase;letter-spacing:.04em}
.tcard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:10px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
#buy{flex:1;min-height:0;display:flex;flex-direction:column}
.summary{padding:0 14px 8px;color:var(--muted);font-size:13px}
.summary b{color:var(--text)}
.blist{flex:1;overflow-y:auto;padding:0 10px 90px}
.card{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.card .t{font-size:15px}
.price{flex:none;font-weight:600;font-size:14px;text-align:right}
.price small{display:block;color:var(--muted);font-weight:400;font-size:11px}
.done .price{color:var(--muted)}
.card a{color:var(--q2);font-size:12px;text-decoration:none}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;margin:3px 4px 0 0;color:#fff}
.tag.cart{background:#f08c1a}.tag.wish{background:#c64f9b}.tag.other{background:#6b7180}
#fab{position:fixed;right:18px;bottom:calc(74px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--q2);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:5}
nav{display:flex;border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:9px 0 8px;font-size:12px}
nav button span{display:block;font-size:19px;line-height:1.1}
nav button.on{color:var(--q2);font-weight:600}
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:10}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-radius:18px 18px 0 0;z-index:11;padding:16px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .2s;max-width:640px;margin:0 auto;max-height:92vh;overflow-y:auto}
body.sheet-open #sheet{transform:none}body.sheet-open #backdrop{display:block}
#sheet h2{margin:0 0 10px;font-size:17px}
.in{width:100%;font-size:16px;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);margin-bottom:8px}
.two{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.lbl{font-size:12px;color:var(--muted);margin:6px 0 4px}
.qpick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 12px}
.qpick button,.seg button{border:2px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:10px 6px;font-size:13px;text-align:left}
.qpick button small{display:block;color:var(--muted);font-size:11px}
.qpick button.sel,.seg button.sel{border-color:var(--c,var(--q2));box-shadow:inset 0 0 0 1px var(--c,var(--q2))}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.seg button{text-align:center}
.row{display:flex;gap:8px;margin-top:6px}
.row button{flex:1;padding:13px;border-radius:10px;border:0;font-size:16px;font-weight:600}
.save{background:var(--q2);color:#fff}.del{background:none;color:var(--q1);border:1px solid var(--line)!important;flex:.6!important}
.menu button.m{display:block;width:100%;text-align:left;padding:14px;margin-bottom:8px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;font-size:15px}
.hint{color:var(--muted);font-size:12px;margin:4px 0 0}
#routines,#review{flex:1;min-height:0;overflow-y:auto;padding:4px 10px 90px}
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.rtop{display:flex;gap:10px;align-items:flex-start}
.rdot{flex:none;width:24px;height:24px;border-radius:50%;border:2px dashed var(--line)}
.streak{flex:none;font-size:13px;font-weight:600;color:var(--q3)}
.wgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.wc{height:34px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--muted);font-size:12px;padding:0}
.wc.sc{border-color:var(--q2);color:var(--text)}
.wc.on{background:var(--q2);border-color:var(--q2);color:#fff;font-weight:700}
.wc.miss{border-color:var(--q1);color:var(--q1)}
.wc.today{box-shadow:0 0 0 2px var(--q3)}
.wc:disabled{opacity:.45}
.dpick{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:4px 0 8px}
.dpick button{border:2px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:10px 0;font-size:12px}
.dpick button.sel{border-color:var(--q2);background:rgba(79,140,255,.18)}
.qk{background:var(--bg);color:var(--text);border:1px solid var(--line)!important}
.seg.s4{grid-template-columns:repeat(4,1fr)}
.srow{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:15px}
.srow span{flex:1;word-break:break-word}
.srow.done span{text-decoration:line-through;color:var(--muted)}
.schk{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--q2);background:none;color:#fff;font-size:13px;padding:0;line-height:1}
.srow.done .schk{background:var(--q2)}
.sx{background:none;border:0;color:var(--muted);font-size:15px;padding:4px 8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:26px}.stat span{color:var(--muted);font-size:12px}
.sec{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 4px 6px}
.brow{display:grid;grid-template-columns:84px 1fr 28px;gap:8px;align-items:center;margin:0 4px 8px;font-size:13px}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--c,var(--q2));border-radius:6px;transition:width .4s}
.tip{background:rgba(79,140,255,.15);border-radius:12px;padding:12px;font-size:14px;margin-top:10px}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.chk.pop,.wc.pop{animation:pop .25s}
.vin{animation:fin .2s ease-out}
.leaving{opacity:0;transform:translateX(28px);transition:opacity .18s,transform .18s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom));background:#2b2f3a;color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;display:none;z-index:20;gap:14px;align-items:center;max-width:92vw}
#toast button{background:none;border:0;color:#8fb4ff;font-weight:700;padding:0}
</style>
</head>
<body>
<header><h1>Jasier's Space<small id="sub"></small></h1><div class="hb"><button class="icon-btn" id="sBtn" aria-label="Search">🔍</button><button class="icon-btn" id="menuBtn" aria-label="Menu">⋯</button></div></header>
<div class="sbar" id="sbar" hidden><input id="sIn" type="search" placeholder="Search…" aria-label="Search"></div>
<div class="banner" id="banner" hidden></div>
<main><div class="chips" id="mbar"></div><div id="grid"></div><div id="routines" hidden></div><div id="buy" hidden></div><div id="review" hidden></div></main>
<button id="fab" aria-label="Add">+</button>
<nav><button id="n-matrix"><span>▦</span>Matrix</button><button id="n-routines"><span>🔁</span>Routines</button><button id="n-buy"><span>🛒</span>Buy</button><button id="n-review"><span>📊</span>Review</button></nav>
<div id="toast"></div><div id="backdrop"></div><div id="sheet" role="dialog" aria-modal="true"></div>
<input type="file" id="file" accept="application/json" hidden>
<script>
const Q={1:{name:'Do first',sub:'Urgent · Important'},2:{name:'Schedule',sub:'Not urgent · Important'},3:{name:'Delegate',sub:'Urgent · Not important'},4:{name:'Eliminate',sub:'Not urgent · Not important'}};
const LISTS={cart:'Amazon cart',wish:'Wish list',other:'Other'};
const PRIO={need:'Need',want:'Want',someday:'Someday'},PR={need:0,want:1,someday:2};
const SORTS={new:'Newest',prio:'Priority',price:'Price'};
const KEY='eisenhower-matrix-v1',BK='space-last-backup',FU='space-first-use',SN='space-snooze';
const VIEWS=['matrix','routines','buy','review'];const fromHash=()=>{const x=location.hash.slice(1);return VIEWS.includes(x)?x:'matrix'};
let state=load(),view=fromHash(),rvOff=0,mode='grid',focusQ=null,showDone=true,filter='all',sort='new',qs='',dragId=null;
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.tasks))return{tasks:s.tasks,buys:Array.isArray(s.buys)?s.buys:[],routines:Array.isArray(s.routines)?s.routines:[]}}catch(e){}return{tasks:[],buys:[],routines:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
const TH='space-theme',HP='space-haptics';
const getLS=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const theme=()=>getLS(TH)||'auto';
function applyTheme(){const t=theme(),r=document.documentElement;if(t==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t);
  const dark=t==='dark'||(t==='auto'&&!matchMedia('(prefers-color-scheme:light)').matches);document.querySelector('meta[name=theme-color]').content=dark?'#0f1115':'#f4f5f8'}
applyTheme();
const buzz=n=>{if(getLS(HP)==='off')return;try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
const calm=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
const ls=(k,v)=>{try{if(v===undefined)return+localStorage.getItem(k)||0;localStorage.setItem(k,v)}catch(e){return 0}};
if(!ls(FU))ls(FU,Date.now());
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const $=s=>document.querySelector(s);
function h(tag,p={},...kids){const e=document.createElement(tag);for(const k in p){const v=p[k];if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k.startsWith('on'))e[k]=v;else e.setAttribute(k,v)}e.append(...kids.filter(x=>x!=null&&x!==false));return e}
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmtD=s=>new Date(s+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',minimumFractionDigits:0,maximumFractionDigits:2}).format(n);
const lineTotal=i=>(+i.price||0)*(+i.qty||1);
const hit=(...a)=>!qs||a.join(' ').toLowerCase().includes(qs);
function dueInfo(t){if(!t.due||t.done)return null;const now=new Date(),td=ymd(now),tm=ymd(new Date(now.getTime()+864e5));
  if(t.due<td)return{c:'late',x:'Overdue · '+fmtD(t.due)};if(t.due===td)return{c:'soon',x:'Today'};if(t.due===tm)return{c:'soon',x:'Tomorrow'};return{c:'',x:fmtD(t.due)}}
function safeUrl(u){u=(u||'').trim();if(!u)return'';for(const c of [u,'https://'+u]){try{const x=new URL(c);if(/^https?:$/.test(x.protocol)&&x.hostname.includes('.'))return x.href}catch(e){}}return''}
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return''}};
const cmpTask=(a,b)=>a.done-b.done||(a.due||'9').localeCompare(b.due||'9')||a.created-b.created;
let toastT;function toast(msg,undo){const t=$('#toast');t.textContent='';t.append(msg);if(undo)t.append(h('button',{text:'Undo',onclick:()=>{undo();t.style.display='none';save();render()}}));t.style.display='flex';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',5000)}

function render(){
  const v=view;
  $('#grid').hidden=v!=='matrix';$('#routines').hidden=v!=='routines';$('#buy').hidden=v!=='buy';$('#review').hidden=v!=='review';$('#mbar').hidden=v!=='matrix';
  for(const k of VIEWS)$('#n-'+k).classList.toggle('on',v===k);
  const ns=v==='routines'||v==='review';$('#fab').hidden=v==='review';$('#sBtn').hidden=ns;if(ns){$('#sbar').hidden=true;$('#sBtn').classList.remove('on');qs=''}
  $('#sIn').placeholder=v==='matrix'?'Search tasks…':'Search buy list…';
  banner();
  if(v==='matrix')renderMatrix();else if(v==='buy')renderBuy();else if(v==='routines')renderRoutines();else renderReview();
}
function banner(){
  const b=$('#banner'),n=state.tasks.length+state.buys.length+state.routines.length,base=ls(BK)||ls(FU),days=Math.floor((Date.now()-base)/864e5);
  if(!n||days<7||Date.now()-ls(SN)<3*864e5){b.hidden=true;return}
  b.hidden=false;b.innerHTML='';
  b.append(h('span',{text:(ls(BK)?days+' days since your last backup.':'You have never backed up your data.')}),h('button',{text:'Back up',onclick:()=>{exportData()}}),h('button',{class:'x','aria-label':'Dismiss',text:'✕',onclick:()=>{ls(SN,Date.now());banner()}}));
}
function moveTask(t,q){t.q=q;save();render()}
function dropSpawn(t){if(t.spawn){const i=state.tasks.findIndex(x=>x.id===t.spawn&&!x.done);if(i>=0)state.tasks.splice(i,1);t.spawn=''}}
function spawnNext(t){
  const today=ymd(new Date());let nd=t.due||today,g=0;
  const adv=x=>{const [y,m,d]=x.split('-').map(Number);if(t.rep==='daily')return ymd(new Date(y,m-1,d+1));if(t.rep==='weekly')return ymd(new Date(y,m-1,d+7));return ymd(new Date(y,m,Math.min(d,new Date(y,m+1,0).getDate())))};
  do{nd=adv(nd)}while(nd<=today&&++g<400);
  const n={id:uid(),title:t.title,note:t.note||'',q:t.q,rep:t.rep,due:nd,done:false,doneAt:0,created:Date.now(),subs:(t.subs||[]).map(x=>({id:uid(),t:x.t,d:false}))};
  state.tasks.push(n);t.spawn=n.id;return n}
function setDone(t,v,el){
  const fin=()=>{t.done=v;t.doneAt=v?Date.now():0;let msg='Task completed';
    if(v&&t.rep&&!t.spawn){const n=spawnNext(t);msg='Done · repeats '+fmtD(n.due)}
    if(!v)dropSpawn(t);
    save();render();if(v)toast(msg,()=>{t.done=false;t.doneAt=0;dropSpawn(t)})};
  buzz(v?15:8);
  if(v&&el&&!calm()){el.classList.add('leaving');setTimeout(fin,190)}else fin()}
function metaPills(t){const a=[];if(t.subs&&t.subs.length)a.push(h('span',{class:'pill',text:'☑ '+t.subs.filter(x=>x.d).length+'/'+t.subs.length}));if(t.rep)a.push(h('span',{class:'pill',text:'🔁 '+t.rep}));return a}
function dayLabel(ts){if(!ts)return'Earlier';const d=new Date(ts),n=new Date(),k=ymd(d);if(k===ymd(n))return'Today';if(k===ymd(new Date(n.getTime()-864e5)))return'Yesterday';return fmtD(k)}
function renderDone(g){

function exportData(){const a=h('a',{href:URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),download:'jasiers-space-backup-'+ymd(new Date())+'.json'});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);ls(BK,Date.now());banner()}
$('#file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());if(!Array.isArray(d.tasks)&&!Array.isArray(d.buys)&&!Array.isArray(d.routines))throw 0;
    const s=x=>String(x||''),old=state;
    state={tasks:(d.tasks||[]).filter(t=>t&&typeof t.title==='string'&&[1,2,3,4].includes(t.q)).map(t=>({id:t.id||uid(),title:s(t.title).slice(0,200),note:s(t.note).slice(0,300),due:/^\d{4}-\d\d-\d\d$/.test(t.due)?t.due:'',q:t.q,done:!!t.done,doneAt:+t.doneAt||0,created:+t.created||Date.now(),rep:['daily','weekly','monthly'].includes(t.rep)?t.rep:'',spawn:'',subs:(Array.isArray(t.subs)?t.subs:[]).filter(x=>x&&typeof x.t==='string').map(x=>({id:x.id||uid(),t:s(x.t).slice(0,120),d:!!x.d}))})),
      routines:(d.routines||[]).filter(r=>r&&typeof r.name==='string').map(r=>({id:r.id||uid(),name:s(r.name).slice(0,80),days:(Array.isArray(r.days)?r.days:[]).filter(x=>Number.isInteger(x)&&x>=0&&x<=6),created:+r.created||Date.now(),log:Object.fromEntries(Object.keys(r.log&&typeof r.log==='object'?r.log:{}).filter(k=>/^\d{4}-\d\d-\d\d$/.test(k)&&r.log[k]).map(k=>[k,true]))})),
      buys:(d.buys||[]).filter(i=>i&&typeof i.name==='string').map(i=>({id:i.id||uid(),name:s(i.name).slice(0,200),list:LISTS[i.list]?i.list:'other',prio:PRIO[i.prio]?i.prio:'want',qty:Math.max(1,Math.floor(+i.qty)||1),price:i.price===''||isNaN(+i.price)?'':+i.price,link:s(i.link).slice(0,500),note:s(i.note).slice(0,300),done:!!i.done,doneAt:+i.doneAt||0,created:+i.created||Date.now()}))};
    save();closeSheet();render();toast('Backup imported',()=>{state=old})}catch(err){toast('That file is not a valid backup')}};

function go(v){view=v;qs='';$('#sIn').value='';history.replaceState(null,'','#'+v);render();const el=$('#'+({matrix:'grid',routines:'routines',buy:'buy',review:'review'})[v]);if(el&&!calm()){el.classList.remove('vin');void el.offsetWidth;el.classList.add('vin')}}
VIEWS.forEach(k=>$('#n-'+k).onclick=()=>go(k));
$('#fab').onclick=()=>view==='matrix'?openTask(null):view==='routines'?openRoutine(null):openBuy(null);
$('#menuBtn').onclick=openMenu;$('#backdrop').onclick=closeSheet;
$('#sBtn').onclick=()=>{const b=$('#sbar');b.hidden=!b.hidden;$('#sBtn').classList.toggle('on',!b.hidden);if(b.hidden){qs='';$('#sIn').value='';render()}else $('#sIn').focus()};
$('#sIn').oninput=e=>{qs=e.target.value.trim().toLowerCase();render()};
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
addEventListener('hashchange',()=>{view=fromHash();render()});
render();
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
